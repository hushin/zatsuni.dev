name: Dependabot auto-merge

# Dependabot の PR で走る CI は権限が絞られるため、CI 完了後に
# workflow_run で別途走らせてマージする
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions: {}

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Find PR
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          set -euo pipefail
          # gh pr list の author.login は "app/dependabot" に正規化されるため、
          # "dependabot[bot]" がそのまま返る REST API を直接叩く
          PR=$(gh api -X GET "repos/$GH_REPO/pulls" -f state=open -f head="${GH_REPO%%/*}:$HEAD_BRANCH")
          echo "number=$(echo "$PR" | jq -r '.[0].number // empty')" >> "$GITHUB_OUTPUT"
          echo "author=$(echo "$PR" | jq -r '.[0].user.login // empty')" >> "$GITHUB_OUTPUT"

      # dependabot/fetch-metadata は PR コンテキストでしか動かない（v3 で pr-number 入力が廃止）ため、
      # Dependabot がコミットメッセージに埋め込む updated-dependencies trailer から直接判定する
      - name: Determine update type
        id: update
        if: steps.pr.outputs.author == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          MSG=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER/commits" -q '.[].commit.message')
          TYPES=$(printf '%s\n' "$MSG" | grep -oE 'update-type: version-update:semver-[a-z]+' | sed 's/.*semver-//' | sort -u || true)
          echo "update types: ${TYPES:-none}"

          if [ -n "$TYPES" ]; then
            # 通常のバージョン更新PR: trailer で判定（group PR も含め全て minor 以下のときだけ許可）
            if printf '%s\n' "$TYPES" | grep -qx 'major'; then
              echo "mergeable=false" >> "$GITHUB_OUTPUT"
            else
              echo "mergeable=true" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # 自動セキュリティ修正PR には update-type trailer が付与されないため、
          # 本文の "compare/vOLD...vNEW" リンクからメジャーバージョンの変化有無を判定する
          BODY=$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" -q '.body')
          if ! printf '%s' "$BODY" | grep -q 'Security Alerts page'; then
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          MAJOR_CHANGED=false
          while IFS= read -r pair; do
            [ -z "$pair" ] && continue
            OLD=$(echo "$pair" | sed -E 's#compare/v?([0-9]+)\..*#\1#')
            NEW=$(echo "$pair" | sed -E 's#.*\.\.\.v?([0-9]+)\..*#\1#')
            if [ -z "$OLD" ] || [ -z "$NEW" ] || [ "$OLD" != "$NEW" ]; then
              MAJOR_CHANGED=true
            fi
          done <<< "$(printf '%s' "$BODY" | grep -oE 'compare/v?[0-9]+(\.[0-9]+){1,2}\.\.\.v?[0-9]+(\.[0-9]+){1,2}' || true)"

          if [ "$MAJOR_CHANGED" = true ]; then
            echo "mergeable=false" >> "$GITHUB_OUTPUT"
          else
            echo "mergeable=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge patch/minor updates
        if: steps.update.outputs.mergeable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
        run: gh pr merge --merge "$PR_NUMBER"
